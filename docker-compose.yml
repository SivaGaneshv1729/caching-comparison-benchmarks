version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: caching-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog_db
    ports:
      - "5420:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: caching-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  memcached:
    image: memcached:1.6-alpine
    container_name: caching-memcached
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: caching-app
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/catalog_db
      - REDIS_URL=redis://redis:6379
      - MEMCACHED_URL=memcached:11211
    # Overwrite environment variable to correct service hostnames
    entrypoint: sh -c "npm run seed && npm run start"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
